<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Futsal Manager</title>
  <link rel="stylesheet" href="../comum/comum.css">
  <link rel="stylesheet" href="../login/login.css">
</head>
<body data-publica="true">
  <header class="topo">
    <div class="topo-conteudo">
      <a class="marca" href="../menu/menu.html"><span class="marca-bola" aria-hidden="true">⚽</span><span>Futsal Manager</span></a>
    </div>
  </header>

  <nav class="menu" aria-label="Navegação principal">
    <ul>
      <li><a href="../login/login.html">Entrar</a></li>
      <li><a href="../cadastro/cadastro.html">Criar conta</a></li>
    </ul>
  </nav>

  <main>
    <header class="cabecalho-pagina">
      <h1>Criar conta</h1>
      <p>Cadastre-se como cliente para comprar ingressos.</p>
    </header>

    <section class="cartao caixa-login" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Novo cliente</h2>
      <form id="formCadastro" class="formulario" style="grid-template-columns:1fr">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" required maxlength="100" autocomplete="name">
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required maxlength="100" autocomplete="username">
        </div>
        <div class="campo">
          <label for="senha">Senha (mínimo 6 caracteres)</label>
          <input type="password" id="senha" name="senha" required minlength="6" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" name="confirmar" required minlength="6" autocomplete="new-password">
        </div>
        <div class="acoes-formulario">
          <button type="submit" class="btn btn-bloco">Criar conta</button>
        </div>
      </form>
      <p class="rodape-cartao">Já tem conta? <a href="../login/login.html">Entrar</a></p>
    </section>
  </main>

  <footer class="rodape">
    <p><strong>Futsal Manager</strong> - gestão de competições e venda de ingressos de futsal</p>
    <p>Aluno: <strong id="rodape-aluno">João Felipe</strong> | Turma: <span id="rodape-turma">Informe a turma</span> | Ano: <span id="rodape-ano">2026</span></p>
  </footer>

  <script src="../comum/comum.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
